# .github/workflows/build-frida-termux-deb.yml
# GitHub Actions workflow to build frida-tools .deb package for Termux on Android ARMv7
#
# This workflow automates the process described in the Termux installation script:
# 1. Downloads the appropriate frida-core-devkit for Android ARM
# 2. Installs frida-python using the devkit
# 3. Installs frida-tools via pip
# 4. Packages the installed files into a .deb file for Termux

name: Build Frida Termux DEB

on:
  # Allow manual trigger with version specification
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build (e.g., 17.0.7). Leave empty for latest.'
        required: false
        default: ''
        type: string
      frida_tools_version:
        description: 'Specific frida-tools version (e.g., 13.6.1). Leave empty for latest compatible.'
        required: false
        default: ''
        type: string
  # Automatically run on push to main branch (optional)
  # push:
  #   branches:
  #     - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # Environment Setup
      # ============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils \
            curl \
            git \
            file \
            dpkg \
            fakeroot

      # ============================================
      # Determine Frida Version
      # ============================================

      - name: Get latest Frida version (if not specified)
        id: frida_version
        run: |
          if [ -z "${{ inputs.frida_version }}" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$FRIDA_VERSION" >> $GITHUB_OUTPUT
            echo "Using latest Frida version: $FRIDA_VERSION"
          else
            echo "version=${{ inputs.frida_version }}" >> $GITHUB_OUTPUT
            echo "Using specified Frida version: ${{ inputs.frida_version }}"
          fi

      # ============================================
      # Download and Extract Frida Core Devkit
      # ============================================

      - name: Download frida-core-devkit for Android ARM
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          # For ARMv7, the devkit uses "arm" architecture
          DEVKIT_URL="https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-core-devkit-$FRIDA_VERSION-android-arm.tar.xz"
          echo "Downloading from: $DEVKIT_URL"
          curl -L -o frida-core-devkit-android-arm.tar.xz "$DEVKIT_URL"

      - name: Extract devkit
        run: |
          mkdir -p "$HOME/devkit"
          tar -xvf frida-core-devkit-android-arm.tar.xz -C "$HOME/devkit"
          rm -f frida-core-devkit-android-arm.tar.xz
          echo "Devkit extracted to $HOME/devkit"

      # ============================================
      # Clone and Install frida-python with Devkit
      # ============================================

      - name: Clone and install frida-python
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          # Version comparison function (bash approximation)
          version_ge() {
            # Returns 0 if $1 >= $2
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" != "$1" ]
          }

          # Determine which branch to use based on Frida version
          if version_ge "17.0.7" "$FRIDA_VERSION"; then
            # For versions <= 17.0.7, use the 17.0.7 branch
            git clone https://github.com/AbhiTheModder/frida-python frida-python-android -b 17.0.7
          else
            # For newer versions, use main branch
            git clone https://github.com/AbhiTheModder/frida-python frida-python-android
          fi

          cd frida-python-android
          FRIDA_VERSION="$FRIDA_VERSION" FRIDA_CORE_DEVKIT="$HOME/devkit" pip install --force-reinstall .
          cd ..
          rm -rf frida-python-android

      # ============================================
      # Install frida-tools
      # ============================================

      - name: Install frida-tools
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_TOOLS_VERSION="${{ inputs.frida_tools_version }}"

          # Version comparison helper
          version_ge() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" != "$1" ]
          }

          if [ -n "$FRIDA_TOOLS_VERSION" ]; then
            # Use specified version
            pip install --upgrade frida-tools=="$FRIDA_TOOLS_VERSION"
          elif version_ge "17.0.7" "$FRIDA_VERSION"; then
            if version_ge "17.0.0" "$FRIDA_VERSION"; then
              # Versions between 17.0.0 and 17.0.7
              pip install --upgrade "frida-tools<=14.0.2"
            else
              # Versions < 17.0.0
              pip install --upgrade "frida-tools<=13.7.1"
            fi
          else
            # Versions > 17.0.7
            pip install --upgrade frida-tools
          fi

      # ============================================
      # Prepare Files for .deb Packaging
      # ============================================

      - name: Prepare package files
        run: |
          PKG_NAME="frida-tools"
          PKG_VERSION="${{ steps.frida_version.outputs.version }}"
          # Remove leading 'v' if present
          PKG_VERSION="${PKG_VERSION#v}"
          PKG_ARCH="arm"

          # Create staging directory with Termux prefix
          # Termux uses /data/data/com.termux/files/usr as prefix
          STAGING_DIR="${{ github.workspace }}/staging/data/data/com.termux/files/usr"
          mkdir -p "$STAGING_DIR"

          # Copy installed Python packages from pip to staging
          # Find the site-packages directory
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "Site packages: $SITE_PACKAGES"

          # Copy frida and frida_tools packages
          cp -r "$SITE_PACKAGES/frida" "$STAGING_DIR/lib/python3.10/site-packages/" 2>/dev/null || true
          cp -r "$SITE_PACKAGES/frida_tools" "$STAGING_DIR/lib/python3.10/site-packages/" 2>/dev/null || true

          # Copy console scripts (binaries)
          mkdir -p "$STAGING_DIR/bin"
          # Find and copy frida-* scripts from bin directory
          BIN_DIR=$(python -c "import sys; print(sys.exec_prefix)/bin")
          for script in frida frida-*; do
            if [ -f "$BIN_DIR/$script" ]; then
              cp "$BIN_DIR/$script" "$STAGING_DIR/bin/"
            fi
          done

          # Also check for scripts in Python's scripts directory
          SCRIPTS_DIR=$(python -c "import sys; print(sys.prefix)/bin")
          for script in frida frida-*; do
            if [ -f "$SCRIPTS_DIR/$script" ]; then
              cp "$SCRIPTS_DIR/$script" "$STAGING_DIR/bin/"
            fi
          done

          # Make binaries executable
          chmod +x "$STAGING_DIR/bin/"* 2>/dev/null || true

          # Create DEBIAN control directory
          DEBIAN_DIR="${{ github.workspace }}/staging/DEBIAN"
          mkdir -p "$DEBIAN_DIR"

          # Create control file
          cat > "$DEBIAN_DIR/control" << EOF
          Package: $PKG_NAME
          Version: $PKG_VERSION
          Architecture: $PKG_ARCH
          Maintainer: GitHub Actions <actions@github.com>
          Depends: python3
          Description: Frida tools for Termux on Android ARMv7
           Frida is a dynamic instrumentation toolkit for developers, reverse-engineers,
           and security researchers. This package includes frida-tools CLI utilities.
          Homepage: https://frida.re
          EOF

          # Create md5sums file
          cd "${{ github.workspace }}/staging"
          find . -type f ! -path "./DEBIAN/*" -exec md5sum {} \; > "$DEBIAN_DIR/md5sums"

      # ============================================
      # Build .deb Package
      # ============================================

      - name: Build .deb package
        run: |
          PKG_VERSION="${{ steps.frida_version.outputs.version }}"
          PKG_VERSION="${PKG_VERSION#v}"
          PKG_NAME="frida-tools"
          PKG_ARCH="arm"

          # Use dpkg-deb to build the package
          cd "${{ github.workspace }}/staging"
          # Fix permissions
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod 755 ./data/data/com.termux/files/usr/bin/* 2>/dev/null || true

          # Build the .deb
          cd "${{ github.workspace }}"
          dpkg-deb --build staging "${PKG_NAME}_${PKG_VERSION}_${PKG_ARCH}.deb"

          # Verify the package
          file "${PKG_NAME}_${PKG_VERSION}_${PKG_ARCH}.deb"

      # ============================================
      # Upload Artifacts
      # ============================================

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: frida-tools_*.deb
          retention-days: 30

      - name: Upload .deb to release (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-deb
          path: frida-tools_*.deb
          retention-days: 90
