# .github/workflows/build-frida-termux-deb.yml
# Builds frida-tools .deb for Termux (Android ARMv7) using official pre-built wheel for Python 3.10.

name: Build Frida Termux DEB

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version (e.g., 17.17.0). Leave empty for latest.'
        required: false
        default: ''
        type: string
      frida_tools_version:
        description: 'Specific frida-tools version. Leave empty for latest compatible.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Determine Frida version
        id: frida_version
        run: |
          if [ -z "${{ inputs.frida_version }}" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$FRIDA_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.frida_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build inside ARMv7 container using Python 3.10 and pre-built wheel
        id: build
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          FRIDA_TOOLS_VERSION="${{ inputs.frida_tools_version }}"

          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/workspace" \
            -w /workspace \
            arm32v7/debian:bookworm-slim \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              echo '=== Installing Python 3.10 and dependencies ==='
              apt-get update
              apt-get install -y --no-install-recommends \
                python3.10 python3.10-venv python3.10-dev \
                curl git file build-essential

              # Create a virtual environment using Python 3.10
              python3.10 -m venv /venv
              source /venv/bin/activate
              pip install --upgrade pip

              echo '=== Downloading frida-python wheel for Android ARM (cp310) ==='
              WHEEL_URL=\"https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-python-${FRIDA_VERSION}-android-arm-cp310.whl\"
              echo \"Downloading \$WHEEL_URL\"
              curl -L -o frida-python-android-arm.whl \"\$WHEEL_URL\"
              # Check if file is valid (should be > 100 bytes)
              if [ \$(stat -c%s frida-python-android-arm.whl) -lt 100 ]; then
                echo \"Wheel file seems invalid (possibly 404). Trying cp39...\"
                WHEEL_URL=\"https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-python-${FRIDA_VERSION}-android-arm-cp39.whl\"
                curl -L -o frida-python-android-arm.whl \"\$WHEEL_URL\"
              fi
              if [ \$(stat -c%s frida-python-android-arm.whl) -lt 100 ]; then
                echo \"ERROR: No suitable wheel found.\"
                exit 1
              fi

              echo '=== Installing frida from wheel (no compilation) ==='
              pip install --no-deps frida-python-android-arm.whl

              echo '=== Installing frida-tools ==='
              version_ge() {
                [ \"\$(printf '%s\n' \"\$1\" \"\$2\" | sort -V | head -n1)\" != \"\$1\" ]
              }

              if [ -n \"$FRIDA_TOOLS_VERSION\" ]; then
                pip install frida-tools==\"$FRIDA_TOOLS_VERSION\"
              else
                if version_ge \"17.0.7\" \"\$FRIDA_VERSION\"; then
                  if version_ge \"17.0.0\" \"\$FRIDA_VERSION\"; then
                    pip install 'frida-tools<=14.0.2'
                  else
                    pip install 'frida-tools<=13.7.1'
                  fi
                else
                  pip install frida-tools
                fi
              fi

              echo '=== Verifying installation ==='
              python -c 'import frida; print(frida.__version__)'

              echo '=== Preparing staging directory ==='
              STAGING_DIR=\"/workspace/staging/data/data/com.termux/files/usr\"
              mkdir -p \"\$STAGING_DIR/lib/python3.10/site-packages\"
              mkdir -p \"\$STAGING_DIR/bin\"

              VENV_SITE=\$(python -c \"import site; print(site.getsitepackages()[0])\")

              # Copy packages
              cp -r \"\$VENV_SITE/frida\" \"\$STAGING_DIR/lib/python3.10/site-packages/\"
              cp -r \"\$VENV_SITE/frida_tools\" \"\$STAGING_DIR/lib/python3.10/site-packages/\"
              for pkg in colorama prompt_toolkit pygments; do
                if [ -d \"\$VENV_SITE/\$pkg\" ]; then
                  cp -r \"\$VENV_SITE/\$pkg\" \"\$STAGING_DIR/lib/python3.10/site-packages/\"
                fi
              done

              # Copy and fix shebang for scripts
              for script in /venv/bin/frida*; do
                [ -f \"\$script\" ] || continue
                cp \"\$script\" \"\$STAGING_DIR/bin/\"
                sed -i '1s|^#!/.*python.*|#!/data/data/com.termux/files/usr/bin/python3|' \"\$STAGING_DIR/bin/\$(basename \"\$script\")\"
              done
              chmod +x \"\$STAGING_DIR/bin/\"*

              echo '=== Creating DEBIAN control ==='
              DEBIAN_DIR=\"/workspace/staging/DEBIAN\"
              mkdir -p \"\$DEBIAN_DIR\"
              cat > \"\$DEBIAN_DIR/control\" << EOF
              Package: frida-tools
              Version: $FRIDA_VERSION
              Architecture: arm
              Maintainer: GitHub Actions <actions@github.com>
              Depends: python3
              Description: Frida tools for Termux on Android ARMv7
               Frida is a dynamic instrumentation toolkit for developers,
               reverse-engineers, and security researchers.
               This package includes the frida-tools CLI utilities.
              Homepage: https://frida.re
              EOF

              cd /workspace/staging
              find . -type f ! -path \"./DEBIAN/*\" -exec md5sum {} \; > \"\$DEBIAN_DIR/md5sums\"
            "

      - name: Build .deb
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          STAGING_DIR="${{ github.workspace }}/staging"
          PKG_NAME="frida-tools"
          PKG_ARCH="arm"

          find "$STAGING_DIR" -type d -exec chmod 755 {} \;
          find "$STAGING_DIR" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGING_DIR/data/data/com.termux/files/usr/bin/"* 2>/dev/null || true

          cd "${{ github.workspace }}"
          dpkg-deb --build "$STAGING_DIR" "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"
          file "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: frida-tools_*.deb
          retention-days: 30
