name: Build Frida-Tools Termux DEB (ARMv7)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version (e.g., 17.0.7). Leave as "latest" to auto-detect.'
        required: false
        default: 'latest'
        type: string
      frida_tools_version:
        description: 'Frida-tools version (optional, auto-calculated if empty)'
        required: false
        type: string

jobs:
  build-frida-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up QEMU for ARM (armeabi-v7a) emulation via binfmt_misc
      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build DEB in Termux Docker (ARMv7)
        run: |
          # Write the build script that will execute inside the Termux container.
          cat << 'EOF' > build.sh
          #!/data/data/com.termux/files/usr/bin/bash
          set -e
          
          # Establish Termux prefixes
          export PREFIX=/data/data/com.termux/files/usr
          export HOME=/data/data/com.termux/files/home
          export PATH=$PREFIX/bin:$PATH
          
          echo "Updating packages..."
          pkg update -y
          # Added 'which' and 'debianutils' to satisfy the frida-python setup/make scripts
          pkg install -y python git curl tar build-essential pkg-config dpkg which debianutils
          
          # Determine Target Frida Version
          INPUT_FRIDA="${FRIDA_VERSION_INPUT}"
          if [ -z "$INPUT_FRIDA" ] || [ "$INPUT_FRIDA" == "latest" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          else
            FRIDA_VERSION="$INPUT_FRIDA"
          fi
          echo "Selected Frida Version: $FRIDA_VERSION"
          
          # Download Frida Core Devkit for Android ARM (ARMv7)
          DARCH="arm"
          DEVKIT_URL="https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-core-devkit-$FRIDA_VERSION-android-$DARCH.tar.xz"
          echo "Downloading Frida DevKit from $DEVKIT_URL"
          curl -L -o $HOME/devkit.tar.xz "$DEVKIT_URL"
          
          mkdir -p $HOME/devkit
          tar -xf $HOME/devkit.tar.xz -C $HOME/devkit
          
          # Compute version comparisons strictly to select correct tools constraint
          VERSION_INT=$(echo "$FRIDA_VERSION" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          REF_17_0_7=$(echo "17.0.7" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          REF_17_0_0=$(echo "17.0.0" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          
          if [ "$VERSION_INT" -le "$REF_17_0_7" ]; then
              if [ "$VERSION_INT" -lt "$REF_17_0_0" ]; then
                  TOOLS_VERSION="<=13.7.1"
              else
                  TOOLS_VERSION="<=14.0.2"
              fi
              git clone https://github.com/AbhiTheModder/frida-python $HOME/frida-python-android -b 17.0.7
          else
              TOOLS_VERSION=">14.0.2"
              git clone https://github.com/AbhiTheModder/frida-python $HOME/frida-python-android
          fi
          
          # Override with user input if provided
          INPUT_TOOLS="${FRIDA_TOOLS_INPUT}"
          if [ -n "$INPUT_TOOLS" ]; then
              TOOLS_VERSION="==$INPUT_TOOLS"
          fi
          
          cd $HOME/frida-python-android
          
          pip install --upgrade pip setuptools wheel
          
          mkdir -p $HOME/wheels
          
          # Build binary wheel for frida-python natively against Bionic libc via QEMU
          echo "Building frida-python wheel..."
          # We use --no-build-isolation to ensure the build happens exactly in-tree, 
          # preventing PEP 517 from copying the source to a temp directory and losing the Git context,
          # which triggers fallback build paths (like downloading toolchains) in setup.py.
          FRIDA_VERSION="$FRIDA_VERSION" FRIDA_CORE_DEVKIT="$HOME/devkit" pip wheel . --no-build-isolation -w $HOME/wheels
          
          # Build wheel for frida-tools (pulling in all native python dependencies)
          echo "Building frida-tools wheel..."
          cd $HOME
          pip wheel "frida-tools${TOOLS_VERSION}" -w $HOME/wheels
          
          # Prepare directory for Debian package staging
          STAGE=$HOME/termux-pkg
          mkdir -p $STAGE/DEBIAN
          mkdir -p $STAGE$PREFIX
          
          echo "Installing built wheels into isolated staging directory..."
          # Using --root simulates placing files in their absolute final location inside the .deb archive
          pip install --no-index --find-links=$HOME/wheels $HOME/wheels/*.whl --root $STAGE --no-warn-script-location
          
          echo "Creating DEBIAN/control file..."
          cat <<CTRL > $STAGE/DEBIAN/control
          Package: frida-tools
          Version: ${FRIDA_VERSION}
          Architecture: arm
          Maintainer: GitHub Actions Build
          Description: Frida CLI tools natively built for Termux (Android 8.1, armv7)
          Depends: python
          CTRL
          
          echo "Adjusting Python shebangs for Termux standard absolute paths..."
          if [ -d $STAGE$PREFIX/bin ]; then
            for f in $STAGE$PREFIX/bin/*; do
              if [ -f "$f" ]; then
                sed -i "1s|.*|#!$PREFIX/bin/python|" "$f"
                chmod +x "$f"
              fi
            done
          fi
          
          echo "Building Debian package..."
          cd $HOME
          dpkg-deb --build termux-pkg frida-tools-termux_${FRIDA_VERSION}_arm.deb
          
          # Copy out to host mounted workspace
          cp frida-tools-termux_${FRIDA_VERSION}_arm.deb /workspace/
          EOF
          
          chmod +x build.sh

          # Run the build script using the official Termux Docker ARM image.
          docker run --rm --privileged \
            -e FRIDA_VERSION_INPUT="${{ github.event.inputs.frida_version }}" \
            -e FRIDA_TOOLS_INPUT="${{ github.event.inputs.frida_tools_version }}" \
            -v ${{ github.workspace }}:/workspace \
            termux/termux-docker:arm \
            bash -c "cp /workspace/build.sh \$HOME/ && \$HOME/build.sh"

      - name: Upload Termux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: ./*.deb
          if-no-files-found: error
