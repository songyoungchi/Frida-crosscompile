name: Build frida-tools .deb for Termux (armv7 / API 27)

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version to build. Needs a released frida-core-devkit-<version>-android-arm.tar.xz asset."
        required: true
        type: string
        default: "17.0.7"
      frida_tools_version:
        description: "Exact frida-tools version to pin (e.g. 14.0.2). Leave blank to auto-select using the same compatibility rule as the reference script."
        required: false
        type: string
        default: ""
      frida_python_ref:
        description: "Optional branch or commit of AbhiTheModder/frida-python to use. Leave blank for automatic selection."
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PKG_ARCH: arm
  TERMUX_DOCKER_IMAGE: docker.io/termux/termux-docker:arm
  TERMUX_DOCKER_PLATFORM: linux/arm/v7
  FRIDA_PYTHON_ANDROID_REPO: https://github.com/AbhiTheModder/frida-python

jobs:
  build:
    name: Build (Termux arm / API 27)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          FRIDA_VERSION="${{ github.event.inputs.frida_version }}"
          if [ -z "$FRIDA_VERSION" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              FRIDA_VERSION="${GITHUB_REF_NAME#v}"
            else
              FRIDA_VERSION="17.0.7"
            fi
          fi
          echo "frida_version=${FRIDA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "frida_tools_version=${{ github.event.inputs.frida_tools_version }}" >> "$GITHUB_OUTPUT"
          echo "frida_python_ref=${{ github.event.inputs.frida_python_ref }}" >> "$GITHUB_OUTPUT"
          echo "Building frida-tools against Frida ${FRIDA_VERSION}"

      - name: Set up QEMU (arm emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Pull Termux arm build image
        run: docker pull --platform "$TERMUX_DOCKER_PLATFORM" "$TERMUX_DOCKER_IMAGE"

      - name: Build frida-tools inside emulated Termux
        env:
          FRIDA_VERSION: ${{ steps.version.outputs.frida_version }}
          FRIDA_TOOLS_VERSION: ${{ steps.version.outputs.frida_tools_version }}
          FRIDA_PYTHON_REF: ${{ steps.version.outputs.frida_python_ref }}
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist"
          mkdir -p "$OUT_DIR"

          SCRIPT="$RUNNER_TEMP/build-in-termux.sh"
          {
            printf '#!/data/data/com.termux/files/usr/bin/bash\n'
            printf 'set -euo pipefail\n'
            printf 'FRIDA_VERSION=%q\n' "$FRIDA_VERSION"
            printf 'FRIDA_TOOLS_VERSION=%q\n' "$FRIDA_TOOLS_VERSION"
            printf 'FRIDA_PYTHON_REF=%q\n' "$FRIDA_PYTHON_REF"
            printf 'TERMUX_PKG_ARCH=%q\n' "$TERMUX_PKG_ARCH"
            printf 'MAINTAINER=%q\n' "$MAINTAINER"
            printf 'FRIDA_PYTHON_ANDROID_REPO=%q\n' "$FRIDA_PYTHON_ANDROID_REPO"
            cat <<'BUILD_SCRIPT_EOF'

          echo "==> Building frida-tools against Frida ${FRIDA_VERSION} (android-${TERMUX_PKG_ARCH})"

          export HOME=/data/data/com.termux/files/home
          export PREFIX=/data/data/com.termux/files/usr
          export PATH="$PREFIX/bin:$PATH"
          cd "$HOME"

          echo "==> Updating Termux package lists"
          pkg update -y
          pkg upgrade -y

          echo "==> Installing build dependencies"
          pkg install -y python git clang make binutils curl dpkg which

          python3 -m pip install --upgrade pip setuptools wheel

          BASELINE_PKGS="$(python3 -m pip list --format=freeze | sort)"

          DEVKIT_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-android-${TERMUX_PKG_ARCH}.tar.xz"
          echo "==> Downloading ${DEVKIT_URL}"
          curl -fL -o "frida-core-devkit-android-${TERMUX_PKG_ARCH}.tar.xz" "$DEVKIT_URL"

          rm -rf "$HOME/devkit"
          mkdir -p "$HOME/devkit"
          tar -xf "frida-core-devkit-android-${TERMUX_PKG_ARCH}.tar.xz" -C "$HOME/devkit"
          rm -f "frida-core-devkit-android-${TERMUX_PKG_ARCH}.tar.xz"

          echo "==> Locating devkit directory"
          DEVKIT_DIR="$(find "$HOME/devkit" -name frida-core.h -printf '%h\n' -quit)"
          if [ -z "$DEVKIT_DIR" ]; then
            echo "::error::Could not locate frida-core.h in devkit"
            exit 1
          fi
          echo "Devkit directory: ${DEVKIT_DIR}"
          export FRIDA_CORE_DEVKIT="$DEVKIT_DIR"

          ver() { echo "$1" | awk -F. '{ printf("%d%03d%03d", $1, $2, $3) }'; }

          if [ -n "$FRIDA_PYTHON_REF" ]; then
            echo "==> Cloning frida-python using explicit ref: ${FRIDA_PYTHON_REF}"
            git clone --branch "$FRIDA_PYTHON_REF" --depth 1 "$FRIDA_PYTHON_ANDROID_REPO" frida-python-android
          else
            if [ "$(ver "$FRIDA_VERSION")" -le "$(ver "17.0.7")" ]; then
              echo "==> Cloning frida-python using branch 17.0.7"
              git clone --branch 17.0.7 --depth 1 "$FRIDA_PYTHON_ANDROID_REPO" frida-python-android
            elif [ "$(ver "$FRIDA_VERSION")" -lt "$(ver "17.10.0")" ]; then
              echo "==> Frida version < 17.10.0; searching for compatible commit before 2026-05-30"
              git clone --single-branch --branch main --filter=blob:none --no-checkout "$FRIDA_PYTHON_ANDROID_REPO" frida-python-android-src
              cd frida-python-android-src
              COMMIT=$(git rev-list -1 --before="2026-05-30 23:59:59" main)
              if [ -z "$COMMIT" ]; then
                echo "::error::Could not find suitable commit before 2026-05-30"
                exit 1
              fi
              echo "Selected commit: ${COMMIT}"
              git checkout "$COMMIT"
              cd ..
              mv frida-python-android-src frida-python-android
            else
              echo "==> Cloning frida-python using main"
              git clone --branch main --depth 1 "$FRIDA_PYTHON_ANDROID_REPO" frida-python-android
            fi
          fi

          (
            cd frida-python-android
            FRIDA_VERSION="$FRIDA_VERSION" FRIDA_CORE_DEVKIT="$HOME/devkit" \
              python3 -m pip install --force-reinstall .
          )
          rm -rf "$HOME/frida-python-android"

          if [ -n "$FRIDA_TOOLS_VERSION" ]; then
            python3 -m pip install --upgrade "frida-tools==${FRIDA_TOOLS_VERSION}"
          else
            python3 -m pip install --upgrade "frida-tools${TOOLS_CONSTRAINT}"
          fi

          PKG_VERSION="$(python3 -m pip show frida-tools | awk -F': ' '/^Version/{print $2}')"
          echo "==> Installed frida-tools ${PKG_VERSION}"

          echo "==> Working out which files belong in the package"
          AFTER_PKGS="$(python3 -m pip list --format=freeze | sort)"
          NEW_PKG_NAMES="$(comm -13 <(printf '%s\n' "$BASELINE_PKGS") <(printf '%s\n' "$AFTER_PKGS") | cut -d'=' -f1)"

          if [ -z "$NEW_PKG_NAMES" ]; then
            echo "No new pip packages were detected - nothing to package." >&2
            exit 1
          fi
          echo "Packages to bundle:"
          echo "$NEW_PKG_NAMES"

          STAGE="$HOME/pkgroot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN"

          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            python3 - "$pkg" "$STAGE" <<'PY_FILE_COPY_EOF'
          import os
          import subprocess
          import sys

          pkg, stage = sys.argv[1], sys.argv[2]
          result = subprocess.run(
              ["python3", "-m", "pip", "show", "-f", pkg],
              capture_output=True, text=True, check=True,
          )

          location, files, in_files = None, [], False
          for line in result.stdout.splitlines():
              if line.startswith("Location:"):
                  location = line.split(":", 1)[1].strip()
              elif line.startswith("Files:"):
                  in_files = True
              elif in_files:
                  if line.startswith(" "):
                      files.append(line.strip())
                  else:
                      in_files = False

          if not location or not files:
              print(f"!! no installed-files record for {pkg}, skipping", file=sys.stderr)
              sys.exit(0)

          for rel in files:
              src = os.path.normpath(os.path.join(location, rel))
              if not os.path.isfile(src):
                  continue
              dst = stage + src
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(src, "rb") as f_in, open(dst, "wb") as f_out:
                  f_out.write(f_in.read())
              os.chmod(dst, os.stat(src).st_mode)
          PY_FILE_COPY_EOF
          done <<< "$NEW_PKG_NAMES"

          DEB_NAME="frida-tools_${PKG_VERSION}_${TERMUX_PKG_ARCH}.deb"
          SIZE_KB="$(du -sk "$STAGE" | cut -f1)"

          cat > "$STAGE/DEBIAN/control" << CONTROL_EOF
          Package: frida-tools
          Version: ${PKG_VERSION}
          Architecture: ${TERMUX_PKG_ARCH}
          Maintainer: ${MAINTAINER}
          Installed-Size: ${SIZE_KB}
          Depends: python
          Homepage: https://frida.re
          Description: Frida CLI tools built for Termux on Android 8.1+ (API 27+), armeabi-v7a
           Built by build-frida-termux-deb.yml against frida-core-devkit ${FRIDA_VERSION},
           using the AbhiTheModder/frida-python bindings. Bundles frida-tools, the
           frida Python bindings, and the pip dependencies pulled in alongside them
           (colorama, prompt-toolkit, pygments, websockets, etc).
          CONTROL_EOF

          mkdir -p "$HOME/output"
          dpkg-deb --root-owner-group --build "$STAGE" "$HOME/output/${DEB_NAME}"

          echo "==> Built package:"
          ls -lh "$HOME/output"
          dpkg-deb --info "$HOME/output/${DEB_NAME}"
          BUILD_SCRIPT_EOF
          } > "$SCRIPT"

          CID=$(docker create --platform "$TERMUX_DOCKER_PLATFORM" --privileged \
            "$TERMUX_DOCKER_IMAGE" bash /data/data/com.termux/files/usr/tmp/build-in-termux.sh)
          docker cp "$SCRIPT" "$CID:/data/data/com.termux/files/usr/tmp/build-in-termux.sh"
          docker start --attach "$CID"
          STATUS=$(docker inspect --format='{{.State.ExitCode}}' "$CID")
          docker cp "$CID:/data/data/com.termux/files/home/output/." "$OUT_DIR/" 2>/dev/null || true
          docker rm -f "$CID" > /dev/null || true

          if [ "$STATUS" != "0" ]; then
            echo "::error::Termux build container exited with status ${STATUS}"
            exit 1
          fi

      - name: Verify package
        run: |
          set -euo pipefail
          ls -lh dist
          DEB_FILE="$(ls dist/*.deb | head -n1)"
          dpkg-deb --info "$DEB_FILE"
          echo "---- contents (first 40 entries) ----"
          dpkg-deb --contents "$DEB_FILE" > /tmp/deb-contents.txt
          head -n 40 /tmp/deb-contents.txt

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: frida-tools-termux-arm-${{ steps.version.outputs.frida_version }}
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
