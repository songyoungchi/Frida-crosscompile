# .github/workflows/build-frida-termux-deb.yml
# Builds a .deb package of frida-tools for Termux (Android ARMv7) using official pre-built wheels.

name: Build Frida Termux DEB

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version to build (e.g., 17.17.0). Leave empty for latest.'
        required: false
        default: ''
        type: string
      frida_tools_version:
        description: 'Specific frida-tools version (e.g., 13.6.1). Leave empty for latest compatible.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            git \
            file \
            dpkg \
            fakeroot

      # ============================================
      # Determine Frida version
      # ============================================

      - name: Get latest Frida version (if not specified)
        id: frida_version
        run: |
          if [ -z "${{ inputs.frida_version }}" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$FRIDA_VERSION" >> $GITHUB_OUTPUT
            echo "Using latest Frida version: $FRIDA_VERSION"
          else
            echo "version=${{ inputs.frida_version }}" >> $GITHUB_OUTPUT
            echo "Using specified Frida version: ${{ inputs.frida_version }}"
          fi

      # ============================================
      # Download frida-python wheel for Android ARM
      # ============================================

      - name: Download frida-python wheel
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          # Remove leading 'v' if present
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          PYTHON_TAG="cp310"  # matches our Python 3.10
          WHEEL_URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-python-${FRIDA_VERSION}-android-arm-${PYTHON_TAG}.whl"
          echo "Downloading $WHEEL_URL"
          curl -L -o frida-python-android-arm.whl "$WHEEL_URL"
          if [ ! -f frida-python-android-arm.whl ]; then
            echo "Error: Failed to download wheel for $FRIDA_VERSION"
            exit 1
          fi
          mkdir -p wheels
          mv frida-python-android-arm.whl wheels/

      # ============================================
      # Install frida-tools and dependencies using --target
      # ============================================

      - name: Install frida-tools with pip (targeting Android ARM)
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          FRIDA_TOOLS_VERSION="${{ inputs.frida_tools_version }}"

          # Temporary installation root
          TEMP_INSTALL="${{ github.workspace }}/temp_install"
          mkdir -p "$TEMP_INSTALL/usr/lib/python3.10/site-packages"

          # Build the pip install command with --target
          PIP_TARGET="$TEMP_INSTALL/usr/lib/python3.10/site-packages"
          PIP_CMD="pip install --target $PIP_TARGET \
                    --platform android_arm \
                    --python-version 3.10 \
                    --implementation cp \
                    --only-binary :all: \
                    --find-links ${{ github.workspace }}/wheels \
                    --no-deps"  # We'll install frida-tools with its dependencies separately

          # First, install frida from the local wheel (this also pulls in its dependencies if any)
          # Actually, frida-python has no dependencies, but we'll install it first
          $PIP_CMD frida

          # Now determine frida-tools version constraint
          if [ -n "$FRIDA_TOOLS_VERSION" ]; then
            TOOLS_SPEC="frida-tools==$FRIDA_TOOLS_VERSION"
          else
            version_ge() {
              [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" != "$1" ]
            }
            if version_ge "17.0.7" "$FRIDA_VERSION"; then
              if version_ge "17.0.0" "$FRIDA_VERSION"; then
                TOOLS_SPEC="frida-tools<=14.0.2"
              else
                TOOLS_SPEC="frida-tools<=13.7.1"
              fi
            else
              TOOLS_SPEC="frida-tools"
            fi
          fi

          # Install frida-tools and its dependencies (which are pure Python, so no platform issues)
          # We remove --no-deps for this step so that dependencies are installed
          # But we still need to use --target and platform options
          pip install --target "$PIP_TARGET" \
                      --platform android_arm \
                      --python-version 3.10 \
                      --implementation cp \
                      --only-binary :all: \
                      --find-links ${{ github.workspace }}/wheels \
                      "$TOOLS_SPEC"

          # Verify installation
          ls -la "$PIP_TARGET" || true

      # ============================================
      # Generate wrapper scripts for frida commands
      # ============================================

      - name: Create wrapper scripts for frida-tools
        run: |
          TEMP_INSTALL="${{ github.workspace }}/temp_install"
          BIN_DIR="$TEMP_INSTALL/usr/bin"
          mkdir -p "$BIN_DIR"

          # List of common frida-tools commands
          COMMANDS="frida frida-ps frida-trace frida-discover frida-kill frida-ls-devices"

          for cmd in $COMMANDS; do
            # Create a wrapper script that calls the corresponding module
            cat > "$BIN_DIR/$cmd" << EOF
          #!/data/data/com.termux/files/usr/bin/sh
          exec python3 -m frida_tools.$cmd "\$@"
          EOF
            chmod +x "$BIN_DIR/$cmd"
          done

          # Also ensure that 'frida' is available (it's already covered)

      # ============================================
      # Stage files for .deb packaging
      # ============================================

      - name: Prepare package staging
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          TEMP_INSTALL="${{ github.workspace }}/temp_install"
          STAGING_DIR="${{ github.workspace }}/staging"

          # Create Termux prefix
          mkdir -p "$STAGING_DIR/data/data/com.termux/files/usr"

          # Copy the installed Python packages and the bin scripts
          cp -r "$TEMP_INSTALL/usr/lib" "$STAGING_DIR/data/data/com.termux/files/usr/"
          cp -r "$TEMP_INSTALL/usr/bin" "$STAGING_DIR/data/data/com.termux/files/usr/"

          # Ensure scripts are executable
          chmod +x "$STAGING_DIR/data/data/com.termux/files/usr/bin/"* || true

          # Create DEBIAN control directory
          DEBIAN_DIR="$STAGING_DIR/DEBIAN"
          mkdir -p "$DEBIAN_DIR"

          # Generate control file
          cat > "$DEBIAN_DIR/control" << EOF
          Package: frida-tools
          Version: $FRIDA_VERSION
          Architecture: arm
          Maintainer: GitHub Actions <actions@github.com>
          Depends: python3
          Description: Frida tools for Termux on Android ARMv7
           Frida is a dynamic instrumentation toolkit for developers,
           reverse-engineers, and security researchers.
           This package includes the frida-tools CLI utilities.
          Homepage: https://frida.re
          EOF

          # Generate md5sums
          cd "$STAGING_DIR"
          find . -type f ! -path "./DEBIAN/*" -exec md5sum {} \; > "$DEBIAN_DIR/md5sums"

      # ============================================
      # Build .deb package
      # ============================================

      - name: Build .deb
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          STAGING_DIR="${{ github.workspace }}/staging"
          PKG_NAME="frida-tools"
          PKG_ARCH="arm"

          # Fix permissions
          find "$STAGING_DIR" -type d -exec chmod 755 {} \;
          find "$STAGING_DIR" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGING_DIR/data/data/com.termux/files/usr/bin/"* 2>/dev/null || true

          # Build the .deb
          cd "${{ github.workspace }}"
          dpkg-deb --build "$STAGING_DIR" "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"

          # Verify
          file "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"

      # ============================================
      # Upload artifact
      # ============================================

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: frida-tools_*.deb
          retention-days: 30
