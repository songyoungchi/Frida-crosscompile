name: Build Frida-Tools Termux DEB (ARMv7)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version (e.g., 17.0.7). Leave as "latest" to auto-detect.'
        required: false
        default: 'latest'
        type: string
      frida_tools_version:
        description: 'Frida-tools version (optional, auto-calculated if empty)'
        required: false
        type: string

jobs:
  build-frida-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Setup Termux ARMv7 Rootfs
        run: |
          # APPROACH EXPLANATION:
          # The prompt requires running the build inside a Termux-compatible environment for ARMv7 Android 8.1.
          # Instead of attempting complex cross-compilation (especially difficult for Python C extensions) via 
          # the x86_64 `termux/package-builder`, we follow the second suggested approach: "set up a minimal 
          # Termux rootfs with qemu-user-static and binfmt_misc to run ARM binaries."
          # 
          # Termux packages use a fixed absolute path prefix (/data/data/com.termux/files/usr). By unpacking 
          # the official ARM (armeabi-v7a) bootstrap to this exact path on the Ubuntu runner and granting 
          # permissions to the current user, we perfectly simulate the Android app sandbox. QEMU transparently 
          # translates all ARMv7 instructions via binfmt_misc. This allows native compilation directly inside 
          # the target environment, yielding correct Bionic libc linkage and matching the provided reference script.
          
          sudo apt-get update
          sudo apt-get install -y unzip curl build-essential
          
          export PREFIX=/data/data/com.termux/files/usr
          export HOME=/data/data/com.termux/files/home
          
          # Create Termux prefix natively on the host runner
          sudo mkdir -p $PREFIX
          sudo mkdir -p $HOME
          sudo chown -R $USER:$USER /data/data
          
          echo "Downloading official Termux ARM bootstrap..."
          curl -sL https://github.com/termux/termux-packages/releases/latest/download/bootstrap-arm.zip -o bootstrap.zip
          unzip -q bootstrap.zip -d $PREFIX
          
          echo "Restoring Termux symlinks from SYMLINKS.txt..."
          cd $PREFIX
          while IFS="←" read -r dest link; do
            if [ -n "$dest" ] && [ -n "$link" ]; then
              ln -sf "$dest" "$link"
            fi
          done < SYMLINKS.txt
          
          echo "Verifying QEMU ARM execution environment..."
          export PATH=$PREFIX/bin:$PATH
          export LD_PRELOAD=$PREFIX/lib/libtermux-exec.so
          uname -m

      - name: Build Frida Wheels
        run: |
          export PREFIX=/data/data/com.termux/files/usr
          export HOME=/data/data/com.termux/files/home
          export PATH=$PREFIX/bin:$PATH
          export LD_PRELOAD=$PREFIX/lib/libtermux-exec.so
          
          echo "Updating Termux packages and installing dependencies..."
          pkg update -y
          pkg install -y python git curl tar build-essential pkg-config
          
          # Determine Target Frida Version
          INPUT_FRIDA="${{ github.event.inputs.frida_version }}"
          if [ -z "$INPUT_FRIDA" ] || [ "$INPUT_FRIDA" == "latest" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          else
            FRIDA_VERSION="$INPUT_FRIDA"
          fi
          echo "Selected Frida Version: $FRIDA_VERSION"
          
          # Download Frida Core Devkit for Android ARM (ARMv7)
          DARCH="arm"
          DEVKIT_URL="https://github.com/frida/frida/releases/download/$FRIDA_VERSION/frida-core-devkit-$FRIDA_VERSION-android-$DARCH.tar.xz"
          echo "Downloading Frida DevKit from $DEVKIT_URL"
          curl -L -o devkit.tar.xz "$DEVKIT_URL"
          
          mkdir -p $HOME/devkit
          tar -xf devkit.tar.xz -C $HOME/devkit
          
          # Compute version comparisons strictly
          VERSION_INT=$(echo "$FRIDA_VERSION" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          REF_17_0_7=$(echo "17.0.7" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          REF_17_0_0=$(echo "17.0.0" | awk -F. '{ printf("%d%03d%03d", $1,$2,$3); }')
          
          # Determine tools version constraints based on target Frida core
          if [ "$VERSION_INT" -le "$REF_17_0_7" ]; then
              if [ "$VERSION_INT" -lt "$REF_17_0_0" ]; then
                  TOOLS_VERSION="<=13.7.1"
              else
                  TOOLS_VERSION="<=14.0.2"
              fi
              git clone https://github.com/AbhiTheModder/frida-python $HOME/frida-python-android -b 17.0.7
          else
              TOOLS_VERSION=">14.0.2"
              git clone https://github.com/AbhiTheModder/frida-python $HOME/frida-python-android
          fi
          
          # Override with user input if provided
          INPUT_TOOLS="${{ github.event.inputs.frida_tools_version }}"
          if [ -n "$INPUT_TOOLS" ]; then
              TOOLS_VERSION="==$INPUT_TOOLS"
          fi
          
          cd $HOME/frida-python-android
          export FRIDA_VERSION=$FRIDA_VERSION
          export FRIDA_CORE_DEVKIT=$HOME/devkit
          
          pip install --upgrade pip setuptools wheel
          
          mkdir -p $HOME/wheels
          
          # Build binary wheel for frida-python against Bionic libc and Android ARM devkit
          echo "Building frida-python wheel natively via QEMU..."
          pip wheel . -w $HOME/wheels
          
          # Build wheel for frida-tools (pulling in all its native python dependencies as well)
          echo "Building frida-tools wheel..."
          cd $HOME
          pip wheel "frida-tools${TOOLS_VERSION}" -w $HOME/wheels

      - name: Package into DEB
        run: |
          export PREFIX=/data/data/com.termux/files/usr
          export HOME=/data/data/com.termux/files/home
          export PATH=$PREFIX/bin:$PATH
          export LD_PRELOAD=$PREFIX/lib/libtermux-exec.so
          
          STAGE=$HOME/termux-pkg
          mkdir -p $STAGE/DEBIAN
          mkdir -p $STAGE$PREFIX
          
          echo "Installing built wheels into isolated staging directory..."
          # Using --root simulates putting files in their absolute final location inside the .deb archive
          pip install --no-index --find-links=$HOME/wheels $HOME/wheels/*.whl --root $STAGE --no-warn-script-location
          
          # Ensure correct version extraction for the .deb metadata naming
          FRIDA_VERSION=$(ls $HOME/wheels/frida-*.whl | head -n 1 | sed -E 's/.*frida-([0-9]+\.[0-9]+\.[0-9]+).*/\1/' || echo "unknown")
          
          echo "Creating DEBIAN/control file..."
          cat <<EOF > $STAGE/DEBIAN/control
          Package: frida-tools-termux
          Version: ${FRIDA_VERSION}
          Architecture: arm
          Maintainer: GitHub Actions Build
          Description: Frida CLI tools natively built for Termux (Android 8.1, armv7)
          Depends: python
          EOF
          
          echo "Adjusting Python shebangs for Termux..."
          # Fix paths so the commands use standard Termux python, ensuring robustness 
          if [ -d $STAGE$PREFIX/bin ]; then
            for f in $STAGE$PREFIX/bin/*; do
              if [ -f "$f" ]; then
                sed -i "1s|.*|#!$PREFIX/bin/python|" "$f"
                chmod +x "$f"
              fi
            done
          fi
          
          echo "Building standard Debian package inside Termux prefix..."
          cd $HOME
          dpkg-deb --build termux-pkg frida-tools-termux_${FRIDA_VERSION}_arm.deb
          
          # Copy to host Github Workspace for artifact upload
          cp frida-tools-termux_${FRIDA_VERSION}_arm.deb ${{ github.workspace }}/

      - name: Upload Termux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: ./*.deb
          if-no-files-found: error
