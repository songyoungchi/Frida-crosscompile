name: Build Rust Frida Project

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'نسخه Frida (مثلاً 17.17.0) - خالی بگذارید برای آخرین نسخه'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Get latest Frida version (if not specified)
        id: frida_version
        run: |
          if [ -z "${{ inputs.frida_version }}" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$FRIDA_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.frida_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build inside ARMv7 container with Rust
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"

          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/workspace" \
            -w /workspace \
            arm32v7/debian:bookworm-slim \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              echo '=== نصب وابستگی‌های سیستمی ==='
              apt-get update
              apt-get install -y --no-install-recommends \
                curl git build-essential pkg-config \
                libssl-dev

              echo '=== نصب Rust ==='
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source \$HOME/.cargo/env
              rustup target add armv7-unknown-linux-gnueabihf

              echo '=== دانلود Frida Core DevKit ==='
              DEVKIT_URL=\"https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-android-arm.tar.xz\"
              curl -L -o frida-core-devkit-android-arm.tar.xz \"\$DEVKIT_URL\"
              mkdir -p /root/devkit
              tar -xvf frida-core-devkit-android-arm.tar.xz -C /root/devkit
              rm -f frida-core-devkit-android-arm.tar.xz

              echo '=== ساخت پروژه Rust ==='
              export FRIDA_CORE_DEVKIT=/root/devkit
              export PKG_CONFIG_PATH=/root/devkit/lib/pkgconfig:\$PKG_CONFIG_PATH
              export LD_LIBRARY_PATH=/root/devkit/lib:\$LD_LIBRARY_PATH

              # اگر پروژه شما در پوشه‌ای غیر از ریشه است، مسیر را تغییر دهید
              cd /workspace

              # کامپایل برای هدف ARMv7
              cargo build --target armv7-unknown-linux-gnueabihf --release

              echo '=== کپی فایل باینری ==='
              mkdir -p /workspace/artifacts
              cp /workspace/target/armv7-unknown-linux-gnueabihf/release/your_project_name /workspace/artifacts/ 2>/dev/null || echo 'فایل پیدا نشد'

              echo '=== ساخت تمام شد ==='
            "

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-rust-binary-armv7
          path: artifacts/
          retention-days: 30
