# .github/workflows/build-frida-termux-deb.yml
# Builds frida-tools .deb for Termux (Android ARMv7) using QEMU and a virtual environment.

name: Build Frida Termux DEB

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: 'Frida version (e.g., 17.17.0). Leave empty for latest.'
        required: false
        default: ''
        type: string
      frida_tools_version:
        description: 'Specific frida-tools version. Leave empty for latest compatible.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Determine Frida version
        id: frida_version
        run: |
          if [ -z "${{ inputs.frida_version }}" ]; then
            FRIDA_VERSION=$(curl --silent "https://api.github.com/repos/frida/frida/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
            echo "version=$FRIDA_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.frida_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build inside ARMv7 container with venv
        id: build
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          FRIDA_TOOLS_VERSION="${{ inputs.frida_tools_version }}"

          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/workspace" \
            -w /workspace \
            arm32v7/debian:bookworm-slim \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive

              echo '=== Installing system dependencies ==='
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv python3-dev \
                git curl xz-utils build-essential pkg-config \
                libssl-dev

              # Create a virtual environment
              python3 -m venv /venv
              source /venv/bin/activate

              echo '=== Installing Python build tools ==='
              pip install --upgrade pip setuptools wheel

              echo '=== Downloading Frida Core DevKit ==='
              DEVKIT_URL=\"https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-core-devkit-${FRIDA_VERSION}-android-arm.tar.xz\"
              curl -L -o frida-core-devkit-android-arm.tar.xz \"\$DEVKIT_URL\"
              mkdir -p /root/devkit
              tar -xvf frida-core-devkit-android-arm.tar.xz -C /root/devkit
              rm -f frida-core-devkit-android-arm.tar.xz

              echo '=== Cloning and building frida-python ==='
              version_ge() {
                [ \"\$(printf '%s\n' \"\$1\" \"\$2\" | sort -V | head -n1)\" != \"\$1\" ]
              }

              if version_ge \"17.0.7\" \"$FRIDA_VERSION\"; then
                git clone https://github.com/AbhiTheModder/frida-python frida-python-android -b 17.0.7
              else
                git clone https://github.com/AbhiTheModder/frida-python frida-python-android
              fi

              cd frida-python-android
              FRIDA_VERSION=\"$FRIDA_VERSION\" FRIDA_CORE_DEVKIT=\"/root/devkit\" pip install --force-reinstall .
              cd ..
              rm -rf frida-python-android

              echo '=== Installing frida-tools ==='
              if [ -n \"$FRIDA_TOOLS_VERSION\" ]; then
                pip install --upgrade frida-tools==\"$FRIDA_TOOLS_VERSION\"
              else
                if version_ge \"17.0.7\" \"$FRIDA_VERSION\"; then
                  if version_ge \"17.0.0\" \"$FRIDA_VERSION\"; then
                    pip install --upgrade 'frida-tools<=14.0.2'
                  else
                    pip install --upgrade 'frida-tools<=13.7.1'
                  fi
                else
                  pip install --upgrade frida-tools
                fi
              fi

              echo '=== Verifying installation ==='
              python -c 'import frida; print(frida.__version__)'
              frida --version || true

              echo '=== Preparing staging directory ==='
              STAGING_DIR=\"/workspace/staging/data/data/com.termux/files/usr\"
              mkdir -p \"\$STAGING_DIR/lib/python3.11/site-packages\"
              mkdir -p \"\$STAGING_DIR/bin\"

              # Copy site-packages from venv
              VENV_SITE=\$(python -c \"import site; print(site.getsitepackages()[0])\")
              cp -r \"\$VENV_SITE/frida\" \"\$STAGING_DIR/lib/python3.11/site-packages/\"
              cp -r \"\$VENV_SITE/frida_tools\" \"\$STAGING_DIR/lib/python3.11/site-packages/\"

              # Copy bin scripts and fix shebang
              for script in /venv/bin/frida*; do
                [ -f \"\$script\" ] || continue
                cp \"\$script\" \"\$STAGING_DIR/bin/\"
                # Replace shebang with Termux Python path
                sed -i '1s|^#!/.*python.*|#!/data/data/com.termux/files/usr/bin/python3|' \"\$STAGING_DIR/bin/\$(basename \"\$script\")\"
              done
              chmod +x \"\$STAGING_DIR/bin/\"*

              echo '=== Creating DEBIAN control ==='
              DEBIAN_DIR=\"/workspace/staging/DEBIAN\"
              mkdir -p \"\$DEBIAN_DIR\"
              cat > \"\$DEBIAN_DIR/control\" << EOF
              Package: frida-tools
              Version: $FRIDA_VERSION
              Architecture: arm
              Maintainer: GitHub Actions <actions@github.com>
              Depends: python3
              Description: Frida tools for Termux on Android ARMv7
               Frida is a dynamic instrumentation toolkit for developers,
               reverse-engineers, and security researchers.
               This package includes the frida-tools CLI utilities.
              Homepage: https://frida.re
              EOF

              cd /workspace/staging
              find . -type f ! -path \"./DEBIAN/*\" -exec md5sum {} \; > \"\$DEBIAN_DIR/md5sums\"
            "

      - name: Build .deb
        run: |
          FRIDA_VERSION="${{ steps.frida_version.outputs.version }}"
          FRIDA_VERSION="${FRIDA_VERSION#v}"
          STAGING_DIR="${{ github.workspace }}/staging"
          PKG_NAME="frida-tools"
          PKG_ARCH="arm"

          find "$STAGING_DIR" -type d -exec chmod 755 {} \;
          find "$STAGING_DIR" -type f -exec chmod 644 {} \;
          chmod 755 "$STAGING_DIR/data/data/com.termux/files/usr/bin/"* 2>/dev/null || true

          cd "${{ github.workspace }}"
          dpkg-deb --build "$STAGING_DIR" "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"
          file "${PKG_NAME}_${FRIDA_VERSION}_${PKG_ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-tools-termux-arm
          path: frida-tools_*.deb
          retention-days: 30
