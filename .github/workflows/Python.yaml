name: Build Python+Pip offline .deb for Termux (armv7)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PKG_ARCH: arm
  TERMUX_DOCKER_IMAGE: docker.io/termux/termux-docker:arm
  TERMUX_DOCKER_PLATFORM: linux/arm/v7

jobs:
  build:
    name: Build Python+Pip bundle (Termux arm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Set up QEMU (arm emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Pull Termux arm build image
        run: docker pull --platform "$TERMUX_DOCKER_PLATFORM" "$TERMUX_DOCKER_IMAGE"

      - name: Build Python+Pip .deb inside Termux
        env:
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist"
          mkdir -p "$OUT_DIR"

          SCRIPT="$RUNNER_TEMP/build-python-deb.sh"
          {
            printf '#!/data/data/com.termux/files/usr/bin/bash\n'
            printf 'set -euo pipefail\n'
            printf 'TERMUX_PKG_ARCH=%q\n' "$TERMUX_PKG_ARCH"
            printf 'MAINTAINER=%q\n' "$MAINTAINER"
            cat <<'BUILD_SCRIPT_EOF'

          echo "==> Building Python+Pip offline package for Termux (android-${TERMUX_PKG_ARCH})"

          export HOME=/data/data/com.termux/files/home
          export PREFIX=/data/data/com.termux/files/usr
          export PATH="$PREFIX/bin:$PATH"
          cd "$HOME"

          echo "==> Setting Termux mirror to official packages.termux.dev"
          echo "deb https://packages.termux.dev/apt/termux-main stable main" > "$PREFIX/etc/apt/sources.list"
          rm -f "$PREFIX/etc/apt/sources.list.d/"*.list 2>/dev/null || true

          echo "==> Updating Termux package lists"
          pkg update -y

          echo "==> Snapshotting installed packages before"
          dpkg-query -W -f='${Package}\t${Version}\n' | sort > "$HOME/before_packages.txt"

          echo "==> Installing python (this also installs python-pip and all dependencies)"
          pkg install -y python

          echo "==> Snapshotting installed packages after"
          dpkg-query -W -f='${Package}\t${Version}\n' | sort > "$HOME/after_packages.txt"

          echo "==> Determining which packages changed or were installed"
          awk 'NR==FNR{a[$1]=$2; next} !($1 in a) || a[$1]!=$2 {print $1}' \
            "$HOME/before_packages.txt" "$HOME/after_packages.txt" > "$HOME/changed_packages.txt"

          if [ ! -s "$HOME/changed_packages.txt" ]; then
            echo "No packages changed - nothing to package." >&2
            exit 1
          fi

          echo "Changed/new packages:"
          cat "$HOME/changed_packages.txt"

          STAGE="$HOME/python-pkgroot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN"

          echo "==> Copying files from changed packages"
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "  - $pkg"
            dpkg-query -L "$pkg" | grep '^/data/data/com.termux/files/usr/' > "$HOME/files_${pkg}.txt" || true
            if [ -s "$HOME/files_${pkg}.txt" ]; then
              tar -C / -cf - --files-from="$HOME/files_${pkg}.txt" | tar -C "$STAGE" -xf -
            fi
          done < "$HOME/changed_packages.txt"

          PY_VERSION="$(dpkg-query -W -f='${Version}' python)"
          echo "Python version: ${PY_VERSION}"

          DEB_NAME="python_${PY_VERSION}_${TERMUX_PKG_ARCH}.deb"
          SIZE_KB="$(du -sk "$STAGE" | cut -f1)"

          cat > "$STAGE/DEBIAN/control" << CONTROL_EOF
          Package: python
          Version: ${PY_VERSION}
          Architecture: ${TERMUX_PKG_ARCH}
          Maintainer: ${MAINTAINER}
          Installed-Size: ${SIZE_KB}
          Depends: 
          Provides: python, python-pip
          Homepage: https://www.python.org
          Description: Python interpreter and pip for Termux (armv7) - offline bundle
           This package contains all files that would be installed by 'pkg install python'
           plus all its dependencies, including python-pip, clang, libllvm, etc.
           Install with: dpkg -i --force-overwrite python_<version>_arm.deb
          CONTROL_EOF

          chmod 755 "$STAGE"
          chmod 755 "$STAGE/DEBIAN"

          mkdir -p "$HOME/output"

          echo "==> Building package with strong compression (zstd -19)"
          dpkg-deb --root-owner-group -Zzstd -z19 --build "$STAGE" "$HOME/output/${DEB_NAME}"

          echo "==> Built package:"
          ls -lh "$HOME/output"
          dpkg-deb --info "$HOME/output/${DEB_NAME}"
          BUILD_SCRIPT_EOF
          } > "$SCRIPT"

          CID=$(docker create --platform "$TERMUX_DOCKER_PLATFORM" --privileged \
            "$TERMUX_DOCKER_IMAGE" bash /data/data/com.termux/files/usr/tmp/build-python-deb.sh)
          docker cp "$SCRIPT" "$CID:/data/data/com.termux/files/usr/tmp/build-python-deb.sh"
          docker start --attach "$CID"
          STATUS=$(docker inspect --format='{{.State.ExitCode}}' "$CID")
          docker cp "$CID:/data/data/com.termux/files/home/output/." "$OUT_DIR/" 2>/dev/null || true
          docker rm -f "$CID" > /dev/null || true

          if [ "$STATUS" != "0" ]; then
            echo "::error::Termux build container exited with status ${STATUS}"
            exit 1
          fi

      - name: Verify package
        run: |
          set -euo pipefail
          ls -lh dist
          DEB_FILE="$(ls dist/*.deb | head -n1)"
          dpkg-deb --info "$DEB_FILE"
          echo "---- contents (first 40 entries) ----"
          dpkg-deb --contents "$DEB_FILE" > /tmp/deb-contents.txt
          head -n 40 /tmp/deb-contents.txt

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: python-termux-arm-offline
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
