name: Build Python .deb for Termux (armv7)

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Optional space-separated list of additional Termux packages to bundle (e.g. python-numpy)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_PKG_ARCH: arm
  TERMUX_DOCKER_IMAGE: docker.io/termux/termux-docker:arm
  TERMUX_DOCKER_PLATFORM: linux/arm/v7

jobs:
  build:
    name: Build Python bundle (Termux arm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Set up QEMU (arm emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Pull Termux arm build image
        run: docker pull --platform "$TERMUX_DOCKER_PLATFORM" "$TERMUX_DOCKER_IMAGE"

      - name: Build Python .deb inside Termux
        env:
          EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist"
          mkdir -p "$OUT_DIR"

          SCRIPT="$RUNNER_TEMP/build-python-deb.sh"
          {
            printf '#!/data/data/com.termux/files/usr/bin/bash\n'
            printf 'set -euo pipefail\n'
            printf 'EXTRA_PACKAGES=%q\n' "$EXTRA_PACKAGES"
            printf 'TERMUX_PKG_ARCH=%q\n' "$TERMUX_PKG_ARCH"
            printf 'MAINTAINER=%q\n' "$MAINTAINER"
            cat <<'BUILD_SCRIPT_EOF'

          echo "==> Building Python bundle for Termux (android-${TERMUX_PKG_ARCH})"

          export HOME=/data/data/com.termux/files/home
          export PREFIX=/data/data/com.termux/files/usr
          export PATH="$PREFIX/bin:$PATH"
          cd "$HOME"

          echo "==> Setting Termux mirror to official packages.termux.dev"
          echo "deb https://packages.termux.dev/apt/termux-main stable main" > "$PREFIX/etc/apt/sources.list"
          rm -f "$PREFIX/etc/apt/sources.list.d/"*.list 2>/dev/null || true

          echo "==> Updating Termux package lists"
          pkg update -y
          pkg upgrade -y

          echo "==> Snapshotting installed packages before"
          dpkg-query -W -f='${Package}\n' | sort > "$HOME/before_packages.txt"

          echo "==> Installing python and python-pip"
          pkg install -y python python-pip $EXTRA_PACKAGES

          echo "==> Snapshotting installed packages after"
          dpkg-query -W -f='${Package}\n' | sort > "$HOME/after_packages.txt"

          NEW_PACKAGES="$(comm -13 "$HOME/before_packages.txt" "$HOME/after_packages.txt")"
          if [ -z "$NEW_PACKAGES" ]; then
            echo "No new packages were installed - nothing to package." >&2
            exit 1
          fi
          echo "Packages to bundle:"
          echo "$NEW_PACKAGES"

          STAGE="$HOME/python-pkgroot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN"

          echo "==> Copying files from new packages"
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "  - $pkg"
            dpkg-query -L "$pkg" > "$HOME/files_${pkg}.txt"
            tar -C / -cf - --files-from="$HOME/files_${pkg}.txt" | tar -C "$STAGE" -xf -
          done <<< "$NEW_PACKAGES"

          PY_VERSION="$(python3 --version | awk '{print $2}')"
          echo "Python version detected: ${PY_VERSION}"

          DEB_NAME="python-termux_${PY_VERSION}_${TERMUX_PKG_ARCH}.deb"
          SIZE_KB="$(du -sk "$STAGE" | cut -f1)"

          cat > "$STAGE/DEBIAN/control" << CONTROL_EOF
          Package: python-termux
          Version: ${PY_VERSION}
          Architecture: ${TERMUX_PKG_ARCH}
          Maintainer: ${MAINTAINER}
          Installed-Size: ${SIZE_KB}
          Depends: 
          Homepage: https://www.python.org
          Description: Python interpreter and pip bundled for Termux (armv7)
           This package bundles python, python-pip, and their dependencies
           as installed from the official Termux repositories.
           Install with: dpkg -i python-termux_<version>_arm.deb
          CONTROL_EOF

          mkdir -p "$HOME/output"
          dpkg-deb --root-owner-group --build "$STAGE" "$HOME/output/${DEB_NAME}"

          echo "==> Built package:"
          ls -lh "$HOME/output"
          dpkg-deb --info "$HOME/output/${DEB_NAME}"
          BUILD_SCRIPT_EOF
          } > "$SCRIPT"

          CID=$(docker create --platform "$TERMUX_DOCKER_PLATFORM" --privileged \
            "$TERMUX_DOCKER_IMAGE" bash /data/data/com.termux/files/usr/tmp/build-python-deb.sh)
          docker cp "$SCRIPT" "$CID:/data/data/com.termux/files/usr/tmp/build-python-deb.sh"
          docker start --attach "$CID"
          STATUS=$(docker inspect --format='{{.State.ExitCode}}' "$CID")
          docker cp "$CID:/data/data/com.termux/files/home/output/." "$OUT_DIR/" 2>/dev/null || true
          docker rm -f "$CID" > /dev/null || true

          if [ "$STATUS" != "0" ]; then
            echo "::error::Termux build container exited with status ${STATUS}"
            exit 1
          fi

      - name: Verify package
        run: |
          set -euo pipefail
          ls -lh dist
          DEB_FILE="$(ls dist/*.deb | head -n1)"
          dpkg-deb --info "$DEB_FILE"
          echo "---- contents (first 40 entries) ----"
          dpkg-deb --contents "$DEB_FILE" > /tmp/deb-contents.txt
          head -n 40 /tmp/deb-contents.txt

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: python-termux-arm
          path: dist/*.deb
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
